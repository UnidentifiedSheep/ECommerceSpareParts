name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a CI release, preview it, or roll back a CD run
        type: choice
        required: true
        default: deploy
        options: [deploy, plan, rollback]
      run_id:
        description: CI run ID for deploy/plan, CD run ID for rollback
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/deploy.yml
    with:
      operation: ${{ inputs.operation || 'deploy' }}
      run_id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.run_id }}
    secrets: inherit
