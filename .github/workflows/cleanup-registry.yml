name: Registry cleanup

on:
  workflow_run:
    workflows: [CD]
    types: [completed]
  workflow_dispatch:
    inputs:
      registry_kind:
        description: Registry to clean
        type: choice
        required: true
        default: primary
        options: [primary, backup]

permissions:
  actions: read
  contents: read

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      EVENT_NAME: ${{ github.event_name }}
      MANUAL_REGISTRY_KIND: ${{ inputs.registry_kind }}

    steps:
      - name: Checkout cleanup tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve successfully deployed release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          def run(*args):
              return subprocess.check_output(args, text=True, timeout=60).strip()
          def skip(message):
              print(message)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('eligible=false\n')
              raise SystemExit(0)
          kind = os.environ['MANUAL_REGISTRY_KIND']
          report = None
          if os.environ['EVENT_NAME'] == 'workflow_run':
              source = os.environ['SOURCE_RUN_ID']
              if not source.isdigit():
                  raise SystemExit('Invalid source run ID.')
              repository = os.environ['GITHUB_REPOSITORY']
              info = json.loads(run('gh', 'api', f'repos/{repository}/actions/runs/{source}'))
              if (info['name'] != 'CD' or info['conclusion'] != 'success'
                      or info['path'].split('@')[0] != '.github/workflows/cd.yml'
                      or info['head_repository']['full_name'] != repository):
                  raise SystemExit('Unexpected source workflow.')
              artifacts = json.loads(run('gh', 'api', f'repos/{repository}/actions/runs/{source}/artifacts'))['artifacts']
              if not any(a['name'] == 'arcane-deployment' and not a['expired'] for a in artifacts):
                  skip('CD did not produce a deployment report; cleanup skipped.')
              run('gh', 'run', 'download', source, '--repo', repository,
                  '--name', 'arcane-deployment', '--dir', 'deployment-input')
              report = json.loads(Path('deployment-input/deployment-report.json').read_text())
              if not (report.get('status') == 'deployed' and report.get('aliases_updated') is True
                      and report.get('operation') == 'deploy' and str(report.get('run_id')) == source
                      and report.get('repository') == repository):
                  skip('CD did not finalize an application release; cleanup skipped.')
              kind = report['release']['registry_kind']
          marker = run('git', 'ls-remote', '--refs', 'origin', 'refs/tags/deployed/production')
          if not marker:
              raise SystemExit('No successful deployment marker exists.')
          sha = marker.split()[0]
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid deployment marker.')
          if report is not None and report['release']['sha'] != sha:
              skip('A newer release is already deployed; cleanup skipped.')
          if kind not in ('primary', 'backup'):
              raise SystemExit('Invalid registry selection.')
          run('git', 'fetch', '--no-tags', 'origin', sha)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'sha={sha}\nregistry_kind={kind}\neligible=true\n')
          PYTHON

      - name: Remove obsolete application SHA tags
        if: steps.release.outputs.eligible == 'true'
        env:
          REGISTRY_KIND: ${{ steps.release.outputs.registry_kind }}
          ARTIFACT_REGISTRY_HOST: ${{ secrets.ARTIFACT_REGISTRY_HOST }}
          ARTIFACT_REGISTRY_USERNAME: ${{ secrets.ARTIFACT_REGISTRY_USERNAME }}
          ARTIFACT_REGISTRY_PASSWORD: ${{ secrets.ARTIFACT_REGISTRY_PASSWORD }}
          BACKUP_ARTIFACT_REGISTRY_HOST: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_HOST }}
          BACKUP_ARTIFACT_REGISTRY_USERNAME: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_USERNAME }}
          BACKUP_ARTIFACT_REGISTRY_PASSWORD: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_PASSWORD }}
          DEPLOYED_SHA: ${{ steps.release.outputs.sha }}
          CLEANUP_DRY_RUN: ${{ vars.REGISTRY_CLEANUP_DRY_RUN || 'false' }}
          CLEANUP_WORKERS: ${{ vars.REGISTRY_CLEANUP_WORKERS || '8' }}
          CLEANUP_MAX_RUNTIME_SECONDS: ${{ vars.REGISTRY_CLEANUP_MAX_RUNTIME_SECONDS || '1200' }}
          CLEANUP_MAX_TAGS: ${{ vars.REGISTRY_CLEANUP_MAX_TAGS || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REGISTRY_KIND" = backup ]; then
            export ARTIFACT_REGISTRY_HOST="$BACKUP_ARTIFACT_REGISTRY_HOST"
            export ARTIFACT_REGISTRY_USERNAME="$BACKUP_ARTIFACT_REGISTRY_USERNAME"
            export ARTIFACT_REGISTRY_PASSWORD="$BACKUP_ARTIFACT_REGISTRY_PASSWORD"
          fi
          args=(--deployed-sha "$DEPLOYED_SHA" --workers "$CLEANUP_WORKERS")
          args+=(--max-runtime-seconds "$CLEANUP_MAX_RUNTIME_SECONDS" --max-tags "$CLEANUP_MAX_TAGS")
          args+=(--report registry-cleanup-report.json)
          case "$CLEANUP_DRY_RUN" in
            true) ;;
            false) args+=(--apply) ;;
            *) echo 'REGISTRY_CLEANUP_DRY_RUN must be true or false.' >&2; exit 1 ;;
          esac
          python3 -u scripts/ci/cleanup-registry.py "${args[@]}" 2>&1 | tee registry-cleanup.log

      - name: Save cleanup diagnostics
        if: ${{ always() && hashFiles('registry-cleanup-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: registry-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            registry-cleanup.log
            registry-cleanup-report.json
          retention-days: 7
