name: Publish Images

on:
  workflow_call:
    inputs:
      matrix:
        description: Affected API, Worker and Migrator Docker build matrix
        required: true
        type: string
      has_images:
        description: Whether the affected matrix contains images to publish
        required: true
        type: boolean
      fusion_artifact:
        description: Actions artifact containing gateway.far for this commit
        required: true
        type: string
permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    if: inputs.has_images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(inputs.matrix) }}
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Fusion archive
        if: matrix.service == 'gateway'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.fusion_artifact }}
          path: artifacts/graphql/Gateway

      - name: Verify Fusion archive
        if: matrix.service == 'gateway'
        shell: bash
        run: |
          set -euo pipefail

          archive="artifacts/graphql/Gateway/gateway.far"
          test -s "$archive"
          unzip -t "$archive"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve GHCR namespace
        id: registry
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.service }}
        id: build_push
        timeout-minutes: 25
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          no-cache: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.registry.outputs.prefix }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}

      - name: Retry build and push ${{ matrix.service }}
        id: retry_build_push
        if: steps.build_push.outcome == 'failure'
        timeout-minutes: 25
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          no-cache: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.registry.outputs.prefix }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}

      - name: Record published image digest
        env:
          RELEASE_SERVICE: ${{ matrix.service }}
          IMAGE_DIGEST: ${{ steps.build_push.outcome == 'success' && steps.build_push.outputs.digest || steps.retry_build_push.outputs.digest }}
        run: python3 scripts/ci/release.py image --output image-digest.json

      - name: Upload published image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.image }}
          path: image-digest.json
          if-no-files-found: error
          retention-days: 30

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
