name: Publish Images

on:
  workflow_call:
    inputs:
      matrix:
        description: Affected API, Worker and Migrator Docker build matrix
        required: true
        type: string
      has_images:
        description: Whether the affected matrix contains images to publish
        required: true
        type: boolean
      fusion_artifact:
        description: Actions artifact containing gateway.far for this commit
        required: true
        type: string
    outputs:
      registry_kind:
        description: Registry selected for publishing and deployment
        value: ${{ jobs.select-registry.outputs.registry_kind }}
    secrets:
      ARTIFACT_REGISTRY_HOST:
        required: true
      ARTIFACT_REGISTRY_USERNAME:
        required: true
      ARTIFACT_REGISTRY_PASSWORD:
        required: true
      BACKUP_ARTIFACT_REGISTRY_HOST:
        required: true
      BACKUP_ARTIFACT_REGISTRY_USERNAME:
        required: true
      BACKUP_ARTIFACT_REGISTRY_PASSWORD:
        required: true

jobs:
  select-registry:
    runs-on: ubuntu-latest

    outputs:
      registry_kind: ${{ steps.select.outputs.registry_kind }}

    steps:
      - name: Login to primary Artifact Registry
        id: primary_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ARTIFACT_REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACT_REGISTRY_USERNAME }}
          password: ${{ secrets.ARTIFACT_REGISTRY_PASSWORD }}

      - name: Login to backup Artifact Registry
        id: backup_login
        if: steps.primary_login.outcome != 'success'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_HOST }}
          username: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_USERNAME }}
          password: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_PASSWORD }}

      - name: Select Artifact Registry
        id: select
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ '${{ steps.primary_login.outcome }}' = 'success' ]; then
            echo 'registry_kind=primary' >> "$GITHUB_OUTPUT"
            echo 'Primary Artifact Registry selected.'
            exit 0
          fi

          if [ '${{ steps.backup_login.outcome }}' = 'success' ]; then
            echo 'registry_kind=backup' >> "$GITHUB_OUTPUT"
            echo 'Primary Artifact Registry login failed; backup registry selected.'
            exit 0
          fi

          echo 'Unable to log in to either primary or backup Artifact Registry.' >&2
          exit 1

  publish-images:
    if: inputs.has_images
    runs-on: ubuntu-latest
    needs: select-registry
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(inputs.matrix) }}
    timeout-minutes: 15

    env:
      ARTIFACT_REGISTRY_HOST: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_HOST || secrets.ARTIFACT_REGISTRY_HOST }}
      ARTIFACT_REGISTRY_USERNAME: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_USERNAME || secrets.ARTIFACT_REGISTRY_USERNAME }}
      ARTIFACT_REGISTRY_PASSWORD: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_PASSWORD || secrets.ARTIFACT_REGISTRY_PASSWORD }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Fusion archive
        if: matrix.service == 'gateway'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.fusion_artifact }}
          path: artifacts/graphql/Gateway

      - name: Verify Fusion archive
        if: matrix.service == 'gateway'
        shell: bash
        run: |
          set -euo pipefail

          archive="artifacts/graphql/Gateway/gateway.far"
          test -s "$archive"
          unzip -t "$archive"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to selected Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: ${{ env.ARTIFACT_REGISTRY_USERNAME }}
          password: ${{ env.ARTIFACT_REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        id: build_push
        timeout-minutes: 5
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:buildcache,mode=min,ignore-error=true

      - name: Retry build and push ${{ matrix.service }}
        if: steps.build_push.outcome == 'failure'
        timeout-minutes: 5
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:buildcache,mode=min,ignore-error=true

  promote-images:
    if: inputs.has_images
    runs-on: ubuntu-latest
    needs: [select-registry, publish-images]

    env:
      ARTIFACT_REGISTRY_HOST: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_HOST || secrets.ARTIFACT_REGISTRY_HOST }}
      ARTIFACT_REGISTRY_USERNAME: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_USERNAME || secrets.ARTIFACT_REGISTRY_USERNAME }}
      ARTIFACT_REGISTRY_PASSWORD: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_PASSWORD || secrets.ARTIFACT_REGISTRY_PASSWORD }}
      IMAGE_TAG: ${{ github.sha }}
      BUILD_MATRIX: ${{ inputs.matrix }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to selected Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: ${{ env.ARTIFACT_REGISTRY_USERNAME }}
          password: ${{ env.ARTIFACT_REGISTRY_PASSWORD }}

      - name: Promote affected images
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r image_name; do
            image="${ARTIFACT_REGISTRY_HOST}/${image_name}"
            release_digest="$(
              docker buildx imagetools inspect "${image}:${IMAGE_TAG}" |
                awk '$1 == "Digest:" { print $2; exit }'
            )"
            if [ -z "$release_digest" ]; then
              echo "Unable to resolve digest for ${image}:${IMAGE_TAG}." >&2
              exit 1
            fi

            if docker buildx imagetools inspect "${image}:current" >/dev/null 2>&1; then
              current_digest="$(
                docker buildx imagetools inspect "${image}:current" |
                  awk '$1 == "Digest:" { print $2; exit }'
              )"
              if [ -z "$current_digest" ]; then
                echo "Unable to resolve digest for ${image}:current." >&2
                exit 1
              fi

              if [ "$current_digest" != "$release_digest" ]; then
                docker buildx imagetools create \
                  --tag "${image}:previous" \
                  "${image}:current"
              else
                echo "${image}:${IMAGE_TAG} is already current; previous tag was preserved."
              fi
            else
              echo "${image}:current does not exist yet; previous tag was not created."
            fi

            docker buildx imagetools create \
              --tag "${image}:current" \
              "${image}:${IMAGE_TAG}"
          done < <(
            jq -r '.include[].image' <<< "$BUILD_MATRIX" | sort -u
          )
