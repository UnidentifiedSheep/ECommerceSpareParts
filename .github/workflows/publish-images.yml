name: Publish Images

on:
  workflow_call:
    outputs:
      registry_kind:
        description: Registry selected for publishing and deployment
        value: ${{ jobs.select-registry.outputs.registry_kind }}
      backup_registry_available:
        description: Whether every image was also published to the backup registry
        value: ${{ jobs.select-registry.outputs.backup_registry_available }}
    secrets:
      ARTIFACT_REGISTRY_HOST:
        required: true
      ARTIFACT_REGISTRY_USERNAME:
        required: true
      ARTIFACT_REGISTRY_PASSWORD:
        required: true
      BACKUP_ARTIFACT_REGISTRY_HOST:
        required: true
      BACKUP_ARTIFACT_REGISTRY_USERNAME:
        required: true
      BACKUP_ARTIFACT_REGISTRY_PASSWORD:
        required: true

jobs:
  select-registry:
    runs-on: ubuntu-latest

    outputs:
      registry_kind: ${{ steps.select.outputs.registry_kind }}
      primary_registry_available: ${{ steps.select.outputs.primary_registry_available }}
      backup_registry_available: ${{ steps.select.outputs.backup_registry_available }}

    steps:
      - name: Login to primary Artifact Registry
        id: primary_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ARTIFACT_REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACT_REGISTRY_USERNAME }}
          password: ${{ secrets.ARTIFACT_REGISTRY_PASSWORD }}

      - name: Login to backup Artifact Registry
        id: backup_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_HOST }}
          username: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_USERNAME }}
          password: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_PASSWORD }}

      - name: Select Artifact Registry
        id: select
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          primary_available=false
          backup_available=false

          if [ '${{ steps.primary_login.outcome }}' = 'success' ]; then
            primary_available=true
          fi

          if [ '${{ steps.backup_login.outcome }}' = 'success' ]; then
            backup_available=true
          fi

          echo "primary_registry_available=$primary_available" >> "$GITHUB_OUTPUT"
          echo "backup_registry_available=$backup_available" >> "$GITHUB_OUTPUT"

          if [ "$primary_available" = true ]; then
            echo 'registry_kind=primary' >> "$GITHUB_OUTPUT"
            echo 'Primary Artifact Registry selected.'
            exit 0
          fi

          if [ "$backup_available" = true ]; then
            echo 'registry_kind=backup' >> "$GITHUB_OUTPUT"
            echo 'Primary Artifact Registry login failed; backup registry selected.'
            exit 0
          fi

          echo 'Unable to log in to either primary or backup Artifact Registry.' >&2
          exit 1

  discover-images:
    runs-on: ubuntu-latest

    env:
      ARTIFACT_REGISTRY_HOST: ${{ secrets.ARTIFACT_REGISTRY_HOST }}
      IMAGE_TAG: ${{ github.sha }}

    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover Docker services
        id: discover
        run: |
          discover_services() {
            docker compose "$@" --env-file .env.example config --format json \
              | python3 -c '
          import json
          import os
          import sys

          data = json.load(sys.stdin)
          workspace = os.getcwd()
          result = []

          def normalize_path(value):
              if not value:
                  return value
              if os.path.isabs(value):
                  return os.path.relpath(value, workspace)
              return value

          for name, service in data["services"].items():
              build = service.get("build")
              if build is None:
                  continue

              image = service.get("image") or (build.get("tags") or [""])[0]
              image_name = image.split("/")[-1].split(":")[0]

              result.append({
                  "service": name,
                  "image": image_name,
                  "context": normalize_path(build.get("context") or "."),
                  "dockerfile": normalize_path(build.get("dockerfile") or "Dockerfile")
              })

          print(json.dumps(result))
          '
          }

          APP_SERVICES=$(discover_services -f compose.yaml -f compose.registry.yaml)
          MIGRATOR_SERVICES=$(discover_services -f migrator-compose.yaml -f migrator-compose.registry.yaml)

          MATRIX=$(APP_SERVICES="$APP_SERVICES" MIGRATOR_SERVICES="$MIGRATOR_SERVICES" python3 -c 'import json, os; print(json.dumps({
              "include": json.loads(os.environ["APP_SERVICES"]) + json.loads(os.environ["MIGRATOR_SERVICES"])
            }))')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  publish-images:
    runs-on: ubuntu-latest
    needs: [select-registry, discover-images]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.discover-images.outputs.matrix) }}
    timeout-minutes: 15

    env:
      ARTIFACT_REGISTRY_HOST: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_HOST || secrets.ARTIFACT_REGISTRY_HOST }}
      PRIMARY_ARTIFACT_REGISTRY_HOST: ${{ secrets.ARTIFACT_REGISTRY_HOST }}
      PRIMARY_ARTIFACT_REGISTRY_USERNAME: ${{ secrets.ARTIFACT_REGISTRY_USERNAME }}
      PRIMARY_ARTIFACT_REGISTRY_PASSWORD: ${{ secrets.ARTIFACT_REGISTRY_PASSWORD }}
      BACKUP_ARTIFACT_REGISTRY_HOST: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_HOST }}
      BACKUP_ARTIFACT_REGISTRY_USERNAME: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_USERNAME }}
      BACKUP_ARTIFACT_REGISTRY_PASSWORD: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_PASSWORD }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to primary Artifact Registry
        if: needs.select-registry.outputs.primary_registry_available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRIMARY_ARTIFACT_REGISTRY_HOST }}
          username: ${{ env.PRIMARY_ARTIFACT_REGISTRY_USERNAME }}
          password: ${{ env.PRIMARY_ARTIFACT_REGISTRY_PASSWORD }}

      - name: Login to backup Artifact Registry
        if: needs.select-registry.outputs.backup_registry_available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.BACKUP_ARTIFACT_REGISTRY_HOST }}
          username: ${{ env.BACKUP_ARTIFACT_REGISTRY_USERNAME }}
          password: ${{ env.BACKUP_ARTIFACT_REGISTRY_PASSWORD }}

      - name: Prepare image tags
        shell: bash
        run: |
          set -euo pipefail

          {
            echo 'PUBLISH_IMAGE_TAGS<<EOF'

            if [ '${{ needs.select-registry.outputs.primary_registry_available }}' = 'true' ]; then
              printf '%s/%s:%s\n' \
                "$PRIMARY_ARTIFACT_REGISTRY_HOST" \
                '${{ matrix.image }}' \
                "$IMAGE_TAG"
            fi

            if [ '${{ needs.select-registry.outputs.backup_registry_available }}' = 'true' ]; then
              printf '%s/%s:%s\n' \
                "$BACKUP_ARTIFACT_REGISTRY_HOST" \
                '${{ matrix.image }}' \
                "$IMAGE_TAG"
            fi

            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.service }}
        id: build_push
        timeout-minutes: 5
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.PUBLISH_IMAGE_TAGS }}
          cache-from: type=registry,ref=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:buildcache,mode=min,ignore-error=true

      - name: Retry build and push ${{ matrix.service }}
        if: steps.build_push.outcome == 'failure'
        timeout-minutes: 5
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.PUBLISH_IMAGE_TAGS }}
          cache-from: type=registry,ref=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:buildcache,mode=min,ignore-error=true
