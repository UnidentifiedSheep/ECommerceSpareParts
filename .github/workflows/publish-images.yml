name: Publish Images

on:
  workflow_call:
    inputs:
      matrix:
        description: Affected API, Worker and Migrator Docker build matrix
        required: true
        type: string
      has_images:
        description: Whether the affected matrix contains images to publish
        required: true
        type: boolean
      fusion_artifact:
        description: Actions artifact containing gateway.far for this commit
        required: true
        type: string
    outputs:
      registry_kind:
        description: Registry selected for publishing and deployment
        value: ${{ jobs.select-registry.outputs.registry_kind }}
    secrets:
      ARTIFACT_REGISTRY_HOST:
        required: true
      ARTIFACT_REGISTRY_USERNAME:
        required: true
      ARTIFACT_REGISTRY_PASSWORD:
        required: true
      BACKUP_ARTIFACT_REGISTRY_HOST:
        required: true
      BACKUP_ARTIFACT_REGISTRY_USERNAME:
        required: true
      BACKUP_ARTIFACT_REGISTRY_PASSWORD:
        required: true

jobs:
  select-registry:
    runs-on: ubuntu-latest

    outputs:
      registry_kind: ${{ steps.select.outputs.registry_kind }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to primary Artifact Registry
        id: primary_login
        continue-on-error: true
        shell: bash
        env:
          ARTIFACT_REGISTRY_HOST: ${{ secrets.ARTIFACT_REGISTRY_HOST }}
          ARTIFACT_REGISTRY_USERNAME: ${{ secrets.ARTIFACT_REGISTRY_USERNAME }}
          ARTIFACT_REGISTRY_PASSWORD: ${{ secrets.ARTIFACT_REGISTRY_PASSWORD }}
        run: bash scripts/ci/login-registry.sh

      - name: Login to backup Artifact Registry
        id: backup_login
        if: steps.primary_login.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          ARTIFACT_REGISTRY_HOST: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_HOST }}
          ARTIFACT_REGISTRY_USERNAME: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_USERNAME }}
          ARTIFACT_REGISTRY_PASSWORD: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_PASSWORD }}
        run: bash scripts/ci/login-registry.sh

      - name: Select Artifact Registry
        id: select
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ '${{ steps.primary_login.outcome }}' = 'success' ]; then
            echo 'registry_kind=primary' >> "$GITHUB_OUTPUT"
            echo 'Primary Artifact Registry selected.'
            exit 0
          fi

          if [ '${{ steps.backup_login.outcome }}' = 'success' ]; then
            echo 'registry_kind=backup' >> "$GITHUB_OUTPUT"
            echo 'Primary Artifact Registry login failed; backup registry selected.'
            exit 0
          fi

          echo 'Unable to log in to either primary or backup Artifact Registry.' >&2
          exit 1

      - name: Log out of Artifact Registries
        if: always()
        shell: bash
        env:
          PRIMARY_REGISTRY: ${{ secrets.ARTIFACT_REGISTRY_HOST }}
          BACKUP_REGISTRY: ${{ secrets.BACKUP_ARTIFACT_REGISTRY_HOST }}
        run: |
          docker logout "$PRIMARY_REGISTRY" >/dev/null 2>&1 || true
          docker logout "$BACKUP_REGISTRY" >/dev/null 2>&1 || true

  publish-images:
    if: inputs.has_images
    runs-on: ubuntu-latest
    needs: select-registry
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(inputs.matrix) }}
    timeout-minutes: 60

    env:
      ARTIFACT_REGISTRY_HOST: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_HOST || secrets.ARTIFACT_REGISTRY_HOST }}
      ARTIFACT_REGISTRY_USERNAME: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_USERNAME || secrets.ARTIFACT_REGISTRY_USERNAME }}
      ARTIFACT_REGISTRY_PASSWORD: ${{ needs.select-registry.outputs.registry_kind == 'backup' && secrets.BACKUP_ARTIFACT_REGISTRY_PASSWORD || secrets.ARTIFACT_REGISTRY_PASSWORD }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Fusion archive
        if: matrix.service == 'gateway'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.fusion_artifact }}
          path: artifacts/graphql/Gateway

      - name: Verify Fusion archive
        if: matrix.service == 'gateway'
        shell: bash
        run: |
          set -euo pipefail

          archive="artifacts/graphql/Gateway/gateway.far"
          test -s "$archive"
          unzip -t "$archive"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to selected Artifact Registry
        shell: bash
        run: bash scripts/ci/login-registry.sh

      - name: Build and push ${{ matrix.service }}
        id: build_push
        timeout-minutes: 25
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          no-cache: true
          provenance: false
          sbom: false
          tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}

      - name: Retry build and push ${{ matrix.service }}
        id: retry_build_push
        if: steps.build_push.outcome == 'failure'
        timeout-minutes: 25
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          no-cache: true
          provenance: false
          sbom: false
          tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}

      - name: Record published image digest
        env:
          RELEASE_SERVICE: ${{ matrix.service }}
          IMAGE_DIGEST: ${{ steps.build_push.outcome == 'success' && steps.build_push.outputs.digest || steps.retry_build_push.outputs.digest }}
        run: python3 scripts/ci/release.py image --output image-digest.json

      - name: Upload published image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.image }}
          path: image-digest.json
          if-no-files-found: error
          retention-days: 30

      - name: Log out of Artifact Registry
        if: always()
        shell: bash
        run: docker logout "$ARTIFACT_REGISTRY_HOST" >/dev/null 2>&1 || true
