name: Deploy through Arcane

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      run_id:
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPERATION: ${{ inputs.operation }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      GH_TOKEN: ${{ github.token }}
      ARCANE_URL: ${{ vars.ARCANE_URL || 'https://arcane.all-vp-n.ru' }}
      ARCANE_ENVIRONMENT_ID: ${{ vars.ARCANE_ENVIRONMENT_ID || '0' }}
      ARCANE_API_KEY: ${{ secrets.ARCANE_API_KEY }}
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'Production' }}
      MIGRATOR_SECRET_NAMES: ${{ vars.MIGRATOR_SECRET_NAMES || '{}' }}
      MIGRATOR_MEMORY_MB: ${{ vars.MIGRATOR_MEMORY_MB || '768' }}
      MIGRATOR_TIMEOUT_SECONDS: ${{ vars.MIGRATOR_TIMEOUT_SECONDS || '1200' }}
      ROLLOUT_TIMEOUT_SECONDS: ${{ vars.ROLLOUT_TIMEOUT_SECONDS || '600' }}
      DEPLOY_STABILITY_SECONDS: ${{ vars.DEPLOY_STABILITY_SECONDS || '45' }}
      DOCKER_CONFIG: /tmp/ecommerce-registry-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: Verify source workflow and release artifact
        id: source
        run: python3 scripts/ci/release.py source --operation "$OPERATION" --run-id "$SOURCE_RUN_ID" --outputs "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.source.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Install Compose parser
        if: steps.source.outputs.should_deploy == 'true'
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Deploy or roll back through Arcane
        if: steps.source.outputs.should_deploy == 'true'
        env:
          PREVIOUS_DEPLOYED_SHA: ${{ steps.source.outputs.previous_sha }}
        shell: bash
        run: |
          set -euo pipefail
          input=release-input/release-manifest.json
          if [ "$OPERATION" = rollback ]; then input=release-input/deployment-report.json; fi
          python3 -u scripts/deploy/arcane.py --operation "$OPERATION" --input "$input" \
            --report deployment-report.json 2>&1 | tee deployment.log

      - name: Update registry aliases after health checks
        if: steps.source.outputs.should_deploy == 'true' && inputs.operation != 'plan'
        shell: bash
        run: |
          set -euo pipefail
          args=(--report deployment-report.json)
          if [ "$OPERATION" = rollback ]; then args+=(--rollback); fi
          python3 -u scripts/ci/release.py promote "${args[@]}"

      - name: Resolve deployment marker
        if: steps.source.outputs.should_deploy == 'true' && inputs.operation != 'plan'
        id: marker
        run: python3 scripts/ci/release.py marker --report deployment-report.json --outputs "$GITHUB_OUTPUT"

      - name: Record successful deployment
        if: steps.source.outputs.should_deploy == 'true' && inputs.operation != 'plan'
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.previous_sha }}
          MARKER_SHA: ${{ steps.marker.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git push "--force-with-lease=refs/tags/deployed/production:${EXPECTED_SHA}" \
            origin "${MARKER_SHA}:refs/tags/deployed/production"

      - name: Save deployment report
        if: ${{ always() && hashFiles('deployment-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: arcane-deployment
          path: |
            deployment-report.json
            deployment.log
            deployment-diagnostics/
          if-no-files-found: error
          retention-days: 90

      - name: Log out of registries
        if: always()
        run: python3 scripts/ci/release.py logout
