name: CI-CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      republish_images:
        description: Comma-separated image names to rebuild and publish without deployment
        required: false
        default: ""
        type: string

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover-affected:
    runs-on: ubuntu-latest

    outputs:
      has_images: ${{ steps.discover.outputs.has_images }}
      should_publish: ${{ steps.discover.outputs.should_publish }}
      should_deploy: ${{ steps.discover.outputs.should_deploy }}
      full_deploy: ${{ steps.discover.outputs.full_deploy }}
      matrix: ${{ steps.discover.outputs.matrix }}
      services: ${{ steps.discover.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Resolve comparison commits
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi

          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
              ;;
            push)
              BASE_SHA="$PUSH_BEFORE_SHA"
              HEAD_SHA="$CURRENT_SHA"
              ;;
            *)
              HEAD_SHA="$CURRENT_SHA"
              if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
                BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
              else
                BASE_SHA="$(git hash-object -t tree -w --stdin < /dev/null)"
              fi
              ;;
          esac

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            else
              BASE_SHA="$(git hash-object -t tree -w --stdin < /dev/null)"
            fi
          fi

          git cat-file -e "$BASE_SHA" 2>/dev/null ||
            git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null ||
            git fetch --no-tags origin "$HEAD_SHA"

          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Comparing $BASE_SHA with $HEAD_SHA"

      - name: Discover affected Docker services
        id: discover
        shell: bash
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          EVENT_NAME: ${{ github.event_name }}
          REPUBLISH_IMAGES: ${{ inputs.republish_images || '' }}
          ARTIFACT_REGISTRY_HOST: affected.invalid
          IMAGE_TAG: affected
        run: |
          set -euo pipefail

          AFFECTED_DIR="$RUNNER_TEMP/dotnet-affected"
          AFFECTED_FILE="$AFFECTED_DIR/affected.txt"
          DEPLOYABLE_FILE="$AFFECTED_DIR/deployable.txt"
          mkdir -p "$AFFECTED_DIR"

          set +e
          dotnet affected \
            --repository-path "$GITHUB_WORKSPACE" \
            --solution-path "$GITHUB_WORKSPACE/ECommerceSpareParts.sln" \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --format text \
            --output-dir "$AFFECTED_DIR" \
            --output-name affected
          AFFECTED_EXIT_CODE=$?
          set -e

          if [ "$AFFECTED_EXIT_CODE" -eq 166 ]; then
            echo "No affected projects were found."
            : > "$AFFECTED_FILE"
          elif [ "$AFFECTED_EXIT_CODE" -ne 0 ]; then
            echo "dotnet-affected failed with exit code ${AFFECTED_EXIT_CODE}." >&2
            exit "$AFFECTED_EXIT_CODE"
          fi

          # Build the file-based app before capturing stdout so compiler/restore
          # diagnostics cannot be mixed with the project-path stream.
          if [ -s "$AFFECTED_FILE" ]; then
            dotnet run --file scripts/ci/DiscoverChangedProjects.cs -- \
              "$AFFECTED_FILE" > /dev/null
            dotnet run --file scripts/ci/DiscoverChangedProjects.cs \
              --no-build -- "$AFFECTED_FILE" > "$DEPLOYABLE_FILE"
          else
            : > "$DEPLOYABLE_FILE"
          fi

          docker compose \
            -f compose.yaml \
            -f compose.registry.yaml \
            -f migrator-compose.yaml \
            -f migrator-compose.registry.yaml \
            --env-file .env.example \
            config --format json > "$AFFECTED_DIR/compose.json"

          python3 - "$DEPLOYABLE_FILE" "$AFFECTED_DIR/compose.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import subprocess
          import sys

          projects_file, compose_file, output_file = sys.argv[1:]
          workspace = os.getcwd()
          republish_images = {
              image.strip()
              for image in os.environ.get("REPUBLISH_IMAGES", "").split(",")
              if image.strip()
          }
          republish_mode = bool(republish_images)

          with open(projects_file, encoding="utf-8-sig") as stream:
              project_paths = [line.strip() for line in stream if line.strip()]

          affected_dockerfiles = {
              os.path.normpath(os.path.relpath(
                  os.path.join(os.path.dirname(project), "Dockerfile"),
                  workspace,
              ))
              for project in project_paths
          }
          if republish_mode:
              affected_dockerfiles.clear()

          changed_paths = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]],
              text=True,
          ).splitlines())
          directly_changed_dockerfiles = {
              os.path.normpath(path)
              for path in changed_paths
              if os.path.basename(path) == "Dockerfile"
          }
          if not republish_mode:
              affected_dockerfiles.update(directly_changed_dockerfiles)

          postgres_image_changed = any(
              path.startswith(".dockerfiles/pgql-cron/")
              for path in changed_paths
          )
          if postgres_image_changed and not republish_mode:
              affected_dockerfiles.add(".dockerfiles/pgql-cron/Dockerfile")

          full_deploy = not republish_mode and (
              os.environ["EVENT_NAME"] == "workflow_dispatch" or any(
                  path.startswith((
                      ".dockerfiles/pgql-cron/",
                      "deploy/stack.",
                      "deploy/grafana/",
                      "deploy/tempo/",
                      "init/",
                      "scripts/deploy/",
                  )) or path in {
                      ".github/workflows/deploy.yml",
                      "prometheus.yml",
                  }
                  for path in changed_paths
              )
          )
          graphql_api_dockerfiles = {
              "src/Services/Main/Main.Api/Dockerfile",
              "src/Services/Search/Search.Api/Dockerfile",
              "src/Services/Analytics/Analytics.Api/Dockerfile",
              "src/Services/Pricing/Pricing.Api/Dockerfile",
          }
          graphql_pipeline_changed = any(
              path.startswith((
                  "schemas/graphql/",
                  "src/Services/GraphQL.Common/",
                  "src/Services/Main/Main.Api/GraphQl/",
                  "src/Services/Search/Search.Api/GraphQl/",
                  "src/Services/Analytics/Analytics.Api/GraphQl/",
                  "src/Services/Pricing/Pricing.Api/GraphQl/",
              )) or path in {
                  ".config/dotnet-tools.json",
                  ".github/workflows/graphql.yml",
                  "scripts/ci/build-graphql.sh",
              }
              for path in changed_paths
          )
          force_gateway = bool(
              affected_dockerfiles.intersection(graphql_api_dockerfiles)
          ) or (graphql_pipeline_changed and not republish_mode)

          with open(compose_file, encoding="utf-8-sig") as stream:
              compose = json.load(stream)

          services = []
          available_images = set()
          republished_images = set()
          for name, service in compose["services"].items():
              if name == "graphql-config":
                  continue

              build = service.get("build")
              if not build:
                  continue

              dockerfile = build.get("dockerfile") or "Dockerfile"
              if os.path.isabs(dockerfile):
                  dockerfile = os.path.relpath(dockerfile, workspace)
              dockerfile = os.path.normpath(dockerfile)

              image = service.get("image") or (build.get("tags") or [""])[0]
              image_name = image.split("/")[-1].split(":")[0]
              available_images.add(image_name)

              is_forced_gateway = force_gateway and name == "gateway"
              is_forced_republish = image_name in republish_images
              if (
                  dockerfile not in affected_dockerfiles and
                  not is_forced_gateway and
                  not is_forced_republish
              ):
                  continue

              if is_forced_republish:
                  republished_images.add(image_name)

              deploy_name = (
                  name.removesuffix(".migrator") + "-migrator"
                  if name.endswith(".migrator")
                  else "postgres-cron" if name == "pgql" else name
              )
              services.append({
                  "service": deploy_name,
                  "image": image_name,
                  "context": os.path.relpath(
                      build.get("context") or ".", workspace
                  ) if os.path.isabs(build.get("context") or ".") else (
                      build.get("context") or "."
                  ),
                  "dockerfile": dockerfile.replace(os.sep, "/"),
              })

          unknown_images = republish_images - available_images
          if unknown_images:
              names = ", ".join(sorted(unknown_images))
              raise SystemExit(f"Unknown images requested for republication: {names}")

          missing_images = republish_images - republished_images
          if missing_images:
              names = ", ".join(sorted(missing_images))
              raise SystemExit(f"Images cannot be republished: {names}")

          services.sort(key=lambda item: item["service"])
          matrix = json.dumps({"include": services}, separators=(",", ":"))
          names = ",".join(item["service"] for item in services)
          should_deploy = not republish_mode and (bool(services) or full_deploy)
          should_publish = bool(services) or should_deploy

          with open(output_file, "a", encoding="utf-8") as stream:
              stream.write(f"has_images={'true' if services else 'false'}\n")
              stream.write(f"should_publish={'true' if should_publish else 'false'}\n")
              stream.write(f"should_deploy={'true' if should_deploy else 'false'}\n")
              stream.write(f"full_deploy={'true' if full_deploy else 'false'}\n")
              stream.write(f"matrix={matrix}\n")
              stream.write(f"services={names}\n")

          print(f"Affected deployable services: {names or 'none'}")
          if force_gateway:
              print("Gateway was included because a GraphQL source schema can change.")
          if full_deploy:
              print("A full Swarm deployment is required by deployment infrastructure changes.")
          if republish_mode:
              print(f"Republish without deployment: {', '.join(sorted(republish_images))}")
          PY

  build:
    uses: ./.github/workflows/build.yml

  test:
    uses: ./.github/workflows/test.yml

  graphql:
    uses: ./.github/workflows/graphql.yml

  coverage:
    needs: test
    uses: ./.github/workflows/coverage.yml

  publish-images:
    needs: [build, test, graphql, discover-affected]
    if: >-
      needs.discover-affected.outputs.should_publish == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish-images.yml
    with:
      matrix: ${{ needs.discover-affected.outputs.matrix }}
      has_images: ${{ needs.discover-affected.outputs.has_images == 'true' }}
      fusion_artifact: ${{ needs.graphql.outputs.fusion_artifact }}
    secrets: inherit

  deploy:
    needs: [publish-images, discover-affected]
    if: >-
      needs.publish-images.result == 'success' &&
      needs.discover-affected.outputs.should_deploy == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    with:
      registry_kind: ${{ needs.publish-images.outputs.registry_kind }}
      services: ${{ needs.discover-affected.outputs.services }}
      full_deploy: ${{ needs.discover-affected.outputs.full_deploy == 'true' }}
    secrets: inherit
