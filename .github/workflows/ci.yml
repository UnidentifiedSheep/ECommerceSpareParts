name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      republish_images:
        description: Comma-separated image names to rebuild and publish without deployment
        required: false
        default: ""
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover-affected:
    runs-on: ubuntu-latest

    outputs:
      has_images: ${{ steps.discover.outputs.has_images }}
      should_publish: ${{ steps.discover.outputs.should_publish }}
      should_deploy: ${{ steps.discover.outputs.should_deploy }}
      matrix: ${{ steps.discover.outputs.matrix }}
      services: ${{ steps.discover.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Resolve comparison commits
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi

          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
              ;;
            *)
              HEAD_SHA="$CURRENT_SHA"
              if deployed_ref="$(git ls-remote --exit-code --refs origin refs/tags/deployed/production)"; then
                BASE_SHA="$(awk '{print $1}' <<< "$deployed_ref")"
                echo "Comparing against the last successful deployment: ${BASE_SHA}"
              else
                status=$?
                if [ "$status" -ne 2 ]; then
                  echo 'Unable to resolve the last successful deployment.' >&2
                  exit "$status"
                fi

                BASE_SHA="$(git hash-object -t tree -w --stdin < /dev/null)"
                echo 'No successful deployment marker found; all projects will be included.'
              fi
              ;;
          esac

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            else
              BASE_SHA="$(git hash-object -t tree -w --stdin < /dev/null)"
            fi
          fi

          git cat-file -e "$BASE_SHA" 2>/dev/null ||
            git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null ||
            git fetch --no-tags origin "$HEAD_SHA"

          if [ "$(git cat-file -t "$BASE_SHA")" != tree ]; then
            BASE_SHA="$(git rev-parse "${BASE_SHA}^{commit}")"
          fi

          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Comparing $BASE_SHA with $HEAD_SHA"

      - name: Discover affected Docker services
        id: discover
        shell: bash
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          EVENT_NAME: ${{ github.event_name }}
          REPUBLISH_IMAGES: ${{ inputs.republish_images || '' }}
        run: |
          set -euo pipefail

          AFFECTED_DIR="$RUNNER_TEMP/dotnet-affected"
          AFFECTED_FILE="$AFFECTED_DIR/affected.txt"
          DEPLOYABLE_FILE="$AFFECTED_DIR/deployable.txt"
          mkdir -p "$AFFECTED_DIR"

          if [ "$(git cat-file -t "$BASE_SHA")" = tree ]; then
            dotnet sln ECommerceSpareParts.sln list |
              awk '/\.csproj$/ { gsub(/\\/, "/"); print }' > "$AFFECTED_FILE"
          else
            set +e
            dotnet affected \
              --repository-path "$GITHUB_WORKSPACE" \
              --solution-path "$GITHUB_WORKSPACE/ECommerceSpareParts.sln" \
              --from "$BASE_SHA" \
              --to "$HEAD_SHA" \
              --format text \
              --output-dir "$AFFECTED_DIR" \
              --output-name affected
            AFFECTED_EXIT_CODE=$?
            set -e

            if [ "$AFFECTED_EXIT_CODE" -eq 166 ]; then
              echo "No affected projects were found."
              : > "$AFFECTED_FILE"
            elif [ "$AFFECTED_EXIT_CODE" -ne 0 ]; then
              echo "dotnet-affected failed with exit code ${AFFECTED_EXIT_CODE}." >&2
              exit "$AFFECTED_EXIT_CODE"
            fi
          fi

          # Build the file-based app before capturing stdout so compiler/restore
          # diagnostics cannot be mixed with the project-path stream.
          if [ -s "$AFFECTED_FILE" ]; then
            dotnet run --file scripts/ci/DiscoverChangedProjects.cs -- \
              "$AFFECTED_FILE" > /dev/null
            dotnet run --file scripts/ci/DiscoverChangedProjects.cs \
              --no-build -- "$AFFECTED_FILE" > "$DEPLOYABLE_FILE"
          else
            : > "$DEPLOYABLE_FILE"
          fi

          python3 scripts/ci/discover-images.py "$DEPLOYABLE_FILE" "$GITHUB_OUTPUT"

  build:
    uses: ./.github/workflows/build.yml

  validate-dockerfiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hadolint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
            -o "$RUNNER_TEMP/hadolint"
          chmod +x "$RUNNER_TEMP/hadolint"

      - name: Lint Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          # Existing images use unpinned apt packages and .NET's APP_UID variable.
          find . -type f -name Dockerfile -print0 |
            xargs -0 -r "$RUNNER_TEMP/hadolint" --failure-threshold warning \
              --ignore DL3008 --ignore DL3015 --ignore DL3066

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check restore subsets
        shell: bash
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" \
            dotnet-subset --version 0.3.2

          while IFS= read -r -d '' dockerfile; do
            project="$(sed -nE 's|^RUN /tools/dotnet-subset restore "([^"]+)".*|\1|p' "$dockerfile")"
            if [ -z "$project" ] || [ ! -f "$project" ]; then
              echo "Invalid project path in $dockerfile: $project" >&2
              exit 1
            fi

            "$RUNNER_TEMP/dotnet-tools/dotnet-subset" restore "$project" \
              --root-directory "$GITHUB_WORKSPACE" \
              --output "$RUNNER_TEMP/subsets/$(basename "$(dirname "$dockerfile")")"
          done < <(find src/Services -type f -name Dockerfile -print0)

  test:
    uses: ./.github/workflows/test.yml

  graphql:
    uses: ./.github/workflows/graphql.yml

  coverage:
    needs: test
    uses: ./.github/workflows/coverage.yml

  publish-images:
    needs: [build, test, graphql, validate-dockerfiles, discover-affected]
    if: >-
      needs.discover-affected.outputs.should_publish == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish-images.yml
    with:
      matrix: ${{ needs.discover-affected.outputs.matrix }}
      has_images: ${{ needs.discover-affected.outputs.has_images == 'true' }}
      fusion_artifact: ${{ needs.graphql.outputs.fusion_artifact }}
    secrets: inherit

  release-manifest:
    runs-on: ubuntu-latest
    needs: [discover-affected, publish-images]
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       github.event_name == 'workflow_dispatch') &&
      needs.discover-affected.result == 'success' &&
      (needs.discover-affected.outputs.has_images != 'true' ||
       needs.publish-images.result == 'success')

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download image digests
        if: needs.discover-affected.outputs.has_images == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: image-digests

      - name: Write release manifest
        shell: bash
        env:
          SHOULD_DEPLOY: ${{ needs.discover-affected.outputs.should_deploy }}
          IMAGE_MATRIX: ${{ needs.discover-affected.outputs.matrix }}
          REGISTRY_KIND: ${{ needs.publish-images.outputs.registry_kind }}
        run: python3 scripts/ci/release.py manifest --images-dir image-digests --output release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
