global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node-exporter"
    dns_sd_configs:
      - names: [ "tasks.node-exporter" ]
        type: A
        port: 9100

  - job_name: "main-api"
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ "tasks.main-api" ]
        type: A
        port: 8080

  - job_name: "pricing-api"
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ "tasks.pricing-api" ]
        type: A
        port: 8080

  - job_name: "analytics-api"
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ "tasks.analytics-api" ]
        type: A
        port: 8080

  - job_name: "search-api"
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ "tasks.search-api" ]
        type: A
        port: 8080

  - job_name: "gateway"
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ "tasks.gateway" ]
        type: A
        port: 8080
