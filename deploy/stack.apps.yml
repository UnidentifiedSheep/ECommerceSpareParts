x-api-service: &api-service
  volumes:
    - ${CONFIGS_PATH:-/opt/ecommerce/configs}:/app/configs:ro
  environment:
    - DOTNET_ENVIRONMENT=${DOTNET_ENVIRONMENT:-Staging}
    - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Staging}
    - DEPLOY_RUN_ID=${DEPLOY_RUN_ID:-local}
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
  networks:
    - backend
  deploy:
    placement:
      constraints:
        - node.labels.workload.api == true
    update_config:
      parallelism: 1
      order: start-first
      failure_action: rollback
      monitor: 30s
      max_failure_ratio: 0
    rollback_config:
      parallelism: 1
      order: stop-first
      failure_action: pause
      monitor: 30s
    restart_policy:
      condition: any
      delay: 5s

services:
  main-api:
    <<: *api-service
    image: ${ARTIFACT_REGISTRY_HOST}/main-api:${IMAGE_TAG}
    networks:
      backend:
        aliases:
          - main-api
    deploy:
      replicas: ${MAIN_API_REPLICAS:-1}
      placement:
        constraints:
          - node.labels.workload.api == true
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 30s
      restart_policy:
